<!DOCTYPE html>
<html lang="en">

<title>RIFT CLIMB</title>
<link rel="apple-touch-icon" id="touchIcon" href="data:,">
<style>
:root {
  --bg: #07070d; --ink: #0b0b14; --paper: #f4f1ea; --gold: #ffc83d; --gold-d: #d99a12;
  --panel: #14141f; --panel2: #1c1c2b; --line: #2a2a3d; --muted: #9a98b0; --red: #ff3b5c; --acc: #2de1c2;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --disp: "Avenir Next Condensed", "AvenirNextCondensed-Heavy", "Futura", "Arial Narrow", Impact, system-ui, sans-serif;
  --num: "DIN Condensed", "DINCondensed-Bold", "Avenir Next Condensed", "Arial Narrow", Impact, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--paper); overflow: hidden;
  position: fixed; inset: 0; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-text-size-adjust: 100%; font-family: var(--disp);
}
canvas#game { position: fixed; inset: 0; display: block; touch-action: none; background: var(--bg); }
#safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; padding: var(--sat) 0 var(--sab) 0; }
#ui { position: fixed; inset: 0; pointer-events: none; }
.screen {
  pointer-events: auto; position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  animation: fadein .18s ease-out;
}
.screen.dim { background: rgba(4, 4, 10, .72); justify-content: center; }
.screen.menu { background: linear-gradient(180deg, rgba(7,7,13,.35), rgba(7,7,13,0) 40%, rgba(7,7,13,.75)); }
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }

button { font: inherit; color: inherit; touch-action: manipulation; }
.btn {
  min-height: 52px; min-width: 44px; padding: 0 18px; border-radius: 14px; border: 3px solid var(--ink);
  background: var(--gold); color: var(--ink); font: italic 800 21px/1 var(--disp); letter-spacing: .03em;
  box-shadow: 0 5px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 var(--gold-d);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.5), inset 0 -2px 0 var(--gold-d); }
.btn.big { min-height: 62px; font-size: 26px; }
.btn.alt { background: #2b2b40; color: var(--paper); box-shadow: 0 5px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.12), inset 0 -4px 0 #1b1b28; }
.btn.ghost { background: transparent; color: var(--paper); border-color: rgba(255,255,255,.25); box-shadow: none; }
.btn.small { min-height: 44px; font-size: 16px; }
.btn.danger { background: var(--red); color: #fff; box-shadow: 0 5px 0 var(--ink), inset 0 -4px 0 #a8122f; }
.btn:disabled { filter: grayscale(.9) brightness(.6); }
.btn.armed { background: #ff9a2e; }
.btn .ic { width: 18px; height: 18px; }
.ic { width: 22px; height: 22px; flex: none; }
.ic.big { width: 40px; height: 40px; }

.top-row { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,0,0,.55); border: 2px solid var(--line); padding: 6px 12px; border-radius: 999px; font: 700 22px/1 var(--num); }
.chip.loop { font: italic 800 15px/1 var(--disp); color: #c9a8ff; }
.logo { margin-top: 2vh; text-align: center; }
.logo svg { width: min(86vw, 340px); height: auto; overflow: visible; }
.logo .lt { font: italic 900 64px var(--disp); letter-spacing: 2px; }
.spacer { flex: 1; }
.menu-btns { display: flex; flex-direction: column; gap: 14px; }
.menu-btns .row { display: flex; gap: 12px; }
.menu-btns .row .btn { flex: 1; }

.head { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; min-height: 52px; }
.head h2 { margin: 0; text-align: center; font: italic 900 28px/1 var(--disp); letter-spacing: .04em; }
.head .back { width: 48px; padding: 0; font-size: 34px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; flex: 1; padding-bottom: 20px; }
.list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.list h3, .panel h3 { margin: 14px 0 2px; font: italic 800 15px/1 var(--disp); color: var(--muted); letter-spacing: .1em; }
.item {
  display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; border-radius: 14px;
  background: var(--panel); border: 2px solid var(--line); text-align: left; width: 100%;
}
.item .info { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.item b { font: italic 800 18px/1.1 var(--disp); }
.item span { font: 500 13px/1.25 system-ui, sans-serif; color: var(--muted); }
.item .btn.buy { min-width: 86px; min-height: 46px; font-size: 18px; padding: 0 10px; }
.pips { display: flex; gap: 4px; margin-top: 3px; }
.pips i { width: 14px; height: 6px; border-radius: 3px; background: #2f2f45; }
.pips i.on { background: var(--gold); }
.toggle { justify-content: space-between; }
.toggle i { width: 54px; height: 32px; border-radius: 16px; background: #34344a; position: relative; border: 2px solid var(--ink); flex: none; }
.toggle i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #9a98b0; transition: left .15s; }

.segs { display: flex; flex-direction: column; gap: 8px; }
.seg { min-height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); text-align: left; padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; }
.seg b { font: italic 800 18px/1 var(--disp); }
.seg span { font: 500 13px system-ui, sans-serif; color: var(--muted); }
.seg.on { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.seg:disabled { opacity: .45; }
.danger-item { border-color: #5a1a28; }
.danger-item b { color: #ff7a90; }
.muted { color: var(--muted); font: 500 14px/1.4 system-ui, sans-serif; margin: 6px 0; }
.center-t { text-align: center; }
.msg { font: 600 17px/1.4 system-ui, sans-serif; margin: 0 0 8px; }

.panel { background: var(--panel); border: 3px solid var(--ink); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 0 rgba(0,0,0,.5), inset 0 0 0 2px var(--line); max-height: 100%; overflow-y: auto; }
.panel.center { text-align: center; }
.panel h2 { margin: 0; font: italic 900 32px/1 var(--disp); letter-spacing: .03em; }
.panel h2.bad { color: var(--red); }
.tag { font: italic 800 13px/1 var(--disp); letter-spacing: .14em; color: #c9a8ff; margin: 0; }

.skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; align-content: start; }
.skin-card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 150px; }
.skin-card b { font: italic 800 13px/1.1 var(--disp); text-align: center; }
.skin-card span { font: 700 12px var(--num); color: var(--gold); display: inline-flex; align-items: center; gap: 3px; }
.skin-card span .ic { width: 14px; height: 14px; }
.skin-card.sel { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.skin-card.locked b { color: var(--muted); }
canvas.mini { display: block; }

.storybg { background: radial-gradient(ellipse at 50% 30%, rgba(24,24,40,.93), rgba(0,0,0,.98) 70%); justify-content: center; }
.story { display: flex; flex-direction: column; gap: 14px; padding: 0 6px; }
.story-stage { font: italic 800 14px/1 var(--disp); letter-spacing: .3em; color: var(--acc); }
.story-title { margin: 0; font: italic 900 40px/0.95 var(--disp); color: #fff; text-shadow: 3px 3px 0 var(--ink), 0 0 24px var(--acc); animation: slidein .5s ease-out both; }
.story-lines p { font: 600 19px/1.45 system-ui, sans-serif; margin: 0 0 12px; color: #ecebf5; opacity: 0; animation: lineIn .7s ease-out forwards; }
.story-coda { font: italic 800 15px/1.3 var(--disp); letter-spacing: .12em; color: var(--acc2); opacity: 0; animation: lineIn .8s ease-out forwards; }
.story-bar { height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.story-bar i { display: block; height: 100%; width: 100%; background: var(--acc); transform-origin: left; animation: bar linear forwards; }
.story .skip { align-self: flex-end; min-width: 110px; }
@keyframes lineIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
@keyframes slidein { from { opacity: 0; transform: translateX(-30px) } to { opacity: 1; transform: none } }
@keyframes bar { from { transform: scaleX(0) } to { transform: scaleX(1) } }

.clearbg { background: rgba(4,4,10,.55); }
.clear { display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
.banner { background: #000; border-top: 4px solid var(--acc); border-bottom: 4px solid var(--acc); padding: 14px 8px; text-align: center; transform: skewY(-3deg); animation: bannerIn .45s cubic-bezier(.2,1.4,.4,1) both; margin: 0 -16px; }
.banner span { display: block; font: italic 800 18px/1 var(--disp); letter-spacing: .2em; color: var(--acc); }
.banner b { display: block; font: italic 900 58px/1 var(--disp); color: #fff; text-shadow: 4px 4px 0 var(--ink); }
@keyframes bannerIn { from { transform: translateX(-110%) skewY(-3deg) } to { transform: skewY(-3deg) } }
.tally { display: flex; flex-direction: column; gap: 10px; }
.tl { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; min-height: 56px; flex-wrap: wrap; transition: opacity .2s, transform .25s cubic-bezier(.2,1.5,.4,1); }
.tl.hide { opacity: 0; transform: translateX(-20px) scale(.95); }
.tl span { font: italic 800 15px/1 var(--disp); letter-spacing: .12em; color: var(--muted); flex: 1; }
.tl b { font: 700 38px/1 var(--num); color: #fff; font-variant-numeric: tabular-nums; }
.tl em { flex-basis: 100%; font: italic 800 15px/1 var(--disp); color: var(--gold); font-style: italic; letter-spacing: .08em; }
.tl i { flex-basis: 100%; font: 600 13px system-ui; color: var(--muted); font-style: normal; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { background: linear-gradient(180deg, #2a2a40, #16161f); border: 3px solid var(--ink); border-radius: 14px; min-height: 150px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 5px 0 var(--ink), inset 0 0 0 2px #3a3a55; }
.card b { font: 700 36px/1 var(--num); color: var(--gold); }
.card span { font: italic 800 14px/1.05 var(--disp); text-align: center; }
.card i { font: 500 12px/1.2 system-ui; color: var(--muted); font-style: normal; text-align: center; }
.card:active { transform: translateY(3px); }
.card:disabled { opacity: .4; }
.relic { min-height: 70px; }
.unlock { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.unlock h1 { margin: 0; font: italic 900 36px/1 var(--disp); text-shadow: 3px 3px 0 var(--ink); }
.unlock .btn { width: 100%; }
.unlock .rays { position: absolute; top: 60px; left: 50%; width: 520px; height: 520px; margin-left: -260px; background: repeating-conic-gradient(rgba(255,200,61,.14) 0 10deg, transparent 10deg 20deg); border-radius: 50%; animation: spin 14s linear infinite; z-index: -1; -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); mask: radial-gradient(circle, #000 20%, transparent 65%); }
@keyframes spin { to { transform: rotate(360deg) } }
.revive .ring { position: relative; width: 110px; height: 110px; margin: 4px auto; }
.revive .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.revive .ring circle { fill: none; stroke: var(--red); stroke-width: 8; stroke-dasharray: 277; stroke-dashoffset: 0; animation: countdown 5s linear forwards; }
.revive .ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 48px var(--num); }
@keyframes countdown { to { stroke-dashoffset: 277 } }
.story-item { --acc: #fff; border-left: 6px solid var(--acc); }
.story-item .tag { color: var(--acc); }

#rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #07070d; color: #fff; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font: italic 900 26px var(--disp); }
#rotate svg { width: 70px; height: 70px; }
@media (orientation: landscape) and (max-height: 600px) { #rotate { display: flex; } }

</style>

<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="ui"></div>
<div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>TURN TO PORTRAIT</div>
<script>
// ---- 00-core.js ----
'use strict';
// ============================================================================
// CORE: utilities, save data, audio, haptics
// ============================================================================

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const fmtInt = n => Math.floor(n).toLocaleString('en-US');
// numbers above 4 digits (boss / elite HP only) are shown compact
const fmtHP = n => (n < 1e6 ? fmtInt(n) : (n / 1e6).toFixed(n < 1e7 ? 2 : 1) + 'M');
const now = () => performance.now() / 1000;

// ---------------------------------------------------------------------------
// Save data (localStorage, always wrapped)
// ---------------------------------------------------------------------------
const SAVE_KEY = 'riftclimb.squad.v1';
const Store = {
  d: null,
  defaults() {
    return {
      v: 1, gems: 0, shop: {}, skinsOwned: ['conscript'], skin: 'conscript',
      settings: { sound: true, music: true, haptics: true },
      story: [], best: 0, bestScore: 0, runsDone: 0, loop: 0, records: {}, tut: {},
      run: null, // { level, coins, relics, loop, cards }
    };
  },
  load() {
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
    const d = this.defaults();
    if (raw) {
      try {
        const p = JSON.parse(raw);
        Object.assign(d, p);
        d.settings = Object.assign(this.defaults().settings, p.settings || {});
      } catch (e) { /* corrupted save: start clean */ }
    }
    this.d = d;
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.d)); } catch (e) { /* storage full or blocked */ } },
  reset() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} this.d = this.defaults(); this.save(); },
};

// ---------------------------------------------------------------------------
// Audio: everything synthesized with WebAudio, no files
// ---------------------------------------------------------------------------
const AudioSys = {
  ctx: null, master: null, sfx: null, mus: null, noiseBuf: null, last: {},
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.9;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.2;
    this.master.connect(comp); comp.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.connect(this.master);
    const len = c.sampleRate;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const ch = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    this.apply();
  },
  unlock() {
    this.init();
    if (!this.ctx) return;
    if (this.ctx.state !== 'running') { try { this.ctx.resume(); } catch (e) {} }
  },
  apply() {
    if (!this.ctx) return;
    const s = Store.d.settings;
    this.sfx.gain.value = s.sound ? 0.8 : 0;
    this.mus.gain.value = s.music ? 0.26 : 0;
  },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  throttle(key, ms) {
    const t = performance.now();
    if (this.last[key] && t - this.last[key] < ms) return true;
    this.last[key] = t; return false;
  },
  tone(o) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f || 440, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.d || 0.1));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.v == null ? 0.2 : o.v, d = o.d || 0.1, a = o.a || 0.004;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(o.dest || this.sfx);
    osc.start(t); osc.stop(t + d + 0.05);
  },
  noise(o) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + (o.at || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass';
    f.frequency.setValueAtTime(o.f || 1200, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + (o.d || 0.2));
    f.Q.value = o.q || 0.8;
    const g = c.createGain(), v = o.v == null ? 0.3 : o.v, d = o.d || 0.2;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    src.start(t, Math.random() * 0.5); src.stop(t + d + 0.05);
  },
};

const SFX = {
  shoot() { if (AudioSys.throttle('shoot', 60)) return; AudioSys.noise({ d: 0.07, v: 0.12, f: 2600, f2: 700, type: 'bandpass', q: 1.2 }); AudioSys.tone({ f: 160, f2: 70, d: 0.06, type: 'square', v: 0.05 }); },
  hit() { if (AudioSys.throttle('hit', 40)) return; AudioSys.noise({ d: 0.05, v: 0.07, f: 2400, type: 'bandpass', q: 2 }); },
  kill() { if (AudioSys.throttle('kill', 50)) return; AudioSys.noise({ d: 0.14, v: 0.14, f: 900, f2: 200 }); AudioSys.tone({ f: 180, f2: 70, d: 0.12, type: 'square', v: 0.07 }); },
  exact(streak) {
    const b = 660 * Math.pow(2, Math.min(streak, 15) / 12);
    AudioSys.tone({ f: b, d: 0.14, type: 'square', v: 0.09 });
    AudioSys.tone({ f: b * 1.5, d: 0.16, type: 'square', v: 0.07, at: 0.05 });
    AudioSys.tone({ f: b * 2, d: 0.3, type: 'sine', v: 0.12, at: 0.1 });
  },
  merge(tier) {
    const f = 196 * Math.pow(2, tier / 5);
    AudioSys.tone({ f, f2: f * 2, d: 0.12, type: 'square', v: 0.11 });
    AudioSys.tone({ f: f * 1.5, d: 0.22, type: 'triangle', v: 0.12, at: 0.06 });
    AudioSys.noise({ d: 0.12, v: 0.08, f: 3000, type: 'highpass' });
  },
  summon() { AudioSys.tone({ f: 330, f2: 880, d: 0.12, type: 'triangle', v: 0.13 }); AudioSys.tone({ f: 990, d: 0.08, type: 'sine', v: 0.06, at: 0.08 }); },
  tile() { [0, 4, 7].forEach((n, i) => AudioSys.tone({ f: 523 * Math.pow(2, n / 12), d: 0.1, type: 'triangle', v: 0.08, at: i * 0.04 })); },
  op(good) { AudioSys.tone({ f: good ? 440 : 330, f2: good ? 990 : 200, d: 0.18, type: 'sawtooth', v: 0.08 }); AudioSys.noise({ d: 0.18, v: 0.09, f: 4000, type: 'highpass' }); },
  sell() { AudioSys.tone({ f: 1200, d: 0.06, type: 'square', v: 0.06 }); AudioSys.tone({ f: 1600, d: 0.1, type: 'square', v: 0.06, at: 0.06 }); },
  coin(i) { AudioSys.tone({ f: 700 + Math.min(i, 60) * 18, d: 0.05, type: 'square', v: 0.045 }); },
  boom() {

// Haptics. iOS Safari has no navigator.vibrate; iOS 18+ gives a system tick when
// a switch-style checkbox toggles, so we fall back to that during touches.
// ---------------------------------------------------------------------------
const Haptic = {
  lbl: null, lastT: 0,
  init() {
    if (navigator.vibrate) return;
    try {
      const lbl = document.createElement('label');
      lbl.setAttribute('aria-hidden', 'true');
      lbl.style.cssText = 'position:fixed;left:-100px;top:-100px;width:1px;height:1px;opacity:0;pointer-events:none;';
      const inp = document.createElement('input');
      inp.type = 'checkbox'; inp.setAttribute('switch', '');
      lbl.appendChild(inp); document.body.appendChild(lbl);
      this.lbl = lbl;
    } catch (e) { this.lbl = null; }
  },
  buzz(ms) {
    if (!Store.d.settings.haptics) return;
    const t = performance.now();
    if (t - this.lastT < 70) return;
    this.lastT = t;
    if (navigator.vibrate) { try { navigator.vibrate(ms || 15); } catch (e) {} return; }
    if (this.lbl) { try { this.lbl.click(); } catch (e) {} }
  },
};

// ---------------------------------------------------------------------------
// Gate sets, generated from the CURRENT squad count so the choice stays close.
// Rule: best and second-best results land within 25% of each other.
// ---------------------------------------------------------------------------

const FORMS = {

  mulsub: { p: 'cmp', free: true, solve: (N, R, k) => (N * k - R >= 1 ? [{ k: 'mul', n: k }, { k: 'sub', n: N * k - R }] : null) },
  muladd: { p: 'cmp', free: true, solve: (N, R, k) => (R - N * k >= 1 ? [{ k: 'mul', n: k }, { k: 'add', n: R - N * k }] : null) },

// BALANCE CHECK

  c.restore();
}

// ---- common bits ----
function animeEye(c, x, y, s, iris, look, sleepy) {
  // tall eye with highlight; look = horizontal offset
  flat(c, P.ell(x, y, 2.6 * s, 3.6 * s), '#ffffff', 0);
  flat(c, P.ell(x + look * s, y + 0.4 * s, 1.9 * s, 2.9 * s), iris, 0);
  flat(c, P.ell(x + look * s, y + 0.8 * s, 1.1 * s, 1.8 * s), INK, 0);
  flat(c, P.circ(x + look * s - 0.7 * s, y - 1 * s, 0.75 * s), '#ffffff', 0);
  c.beginPath(); c.moveTo(x - 3 * s, y - 3.4 * s); c.quadraticCurveTo(x, y - 4.8 * s, x + 3 * s, y - 3.2 * s);
  c.strokeStyle = INK; c.lineWidth = 1.6 * s; c.lineCap = 'round'; c.stroke();
  if (sleepy) {
    flat(c, P.rr(x - 3 * s, y - 4.2 * s, 6 * s, 3.8 * s, 1 * s), sleepy, 0);
    line(c, x - 3 * s, y - 0.4 * s, x + 3 * s, y - 0.4 * s, INK, 1.4 * s);
  }
}

// ============================================================================
// KAI
// o: { t, walk, lean, slam, face, rift, speed }   feet at (0,0), ~56px tall at s=1
// ============================================================================
function drawKai(c, skin, o, s) {
  s = s || 1;
  const fx = new Set(skin.fx);
  const t = o.t || 0, face = o.face || 1, lean = clamp(o.lean || 0, -1, 1);
  const walk = o.walk || 0, slam = o.slam || 0;
  const lw = 2.4 * s;
  const bob = Math.abs(Math.sin(walk)) * 1.6 * s;
  c.save();
  // ground shadow
  c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(0, 0, 16 * s, 4 * s, 0, 0, TAU); c.fill();
  // slam crouch
  const crouch = slam > 0 ? Math.sin(Math.min(1, slam) * Math.PI) * 6 * s : 0;
  c.translate(0, -bob + crouch);
  c.rotate(lean * 0.12);
  const hx = 0, hy = -40 * s;
  const skinC = skin.skin, skinS = '#c99a73', skinR = '#fff1de';

  // ----- behind the body -----
  if (fx.has('wings')) {
    const flap = Math.sin(t * 3) * 0.15;
    for (const sd of [-1, 1]) {
      c.save(); c.translate(sd * 4 * s, -28 * s); c.rotate(sd * (0.5 + flap));
      cel(c, P.ell(sd * 13 * s, -2 * s, 14 * s, 9 * s, sd * 0.3), '#b6aedc', '#7d74a6', '#f2ecff', lw, 2.5 * s);
      flat(c, P.circ(sd * 15 * s, -3 * s, 3.4 * s), '#f2e7c9', 1.4 * s);
      flat(c, P.circ(sd * 15 * s, -3 * s, 1.4 * s), INK, 0);
      c.restore();
    }
  }
  if (fx.has('cape') || fx.has('kelp')) {
    const col = fx.has('kelp') ? '#1f7a5a' : skin.cape || '#c4182d';
    const sh = fx.has('kelp') ? '#0f4a36' : '#7a0d1b';
    const sway = Math.sin(t * 4 + walk) * 3 * s - lean * 8 * s;
    const pts = [-9 * s, -30 * s, 9 * s, -30 * s, 13 * s + sway, -2 * s, 6 * s + sway, 1 * s, 0 + sway, -3 * s, -6 * s + sway, 1 * s, -13 * s + sway, -2 * s];
    cel(c, P.poly(pts), col, sh, fx.has('kelp') ? '#7df0c0' : '#ff6b7d', lw, 3 * s);
  }
  if (fx.has('sheath')) {
    c.save(); c.translate(0, -26 * s); c.rotate(-0.7 * face);
    cel(c, P.rr(-2.2 * s, -22 * s, 4.4 * s, 34 * s, 2 * s), '#3a2a24', '#1e1512', '#7a5c50', lw, 1.5 * s);
    flat(c, P.rr(-3 * s, -24 * s, 6 * s, 5 * s, 1 * s), '#d8c38a', 1.6 * s);
    c.restore();
  }
  if (fx.has('lantern')) {
    const sw = Math.sin(t * 2.5) * 0.15;
    line(c, -8 * s * face, -12 * s, -14 * s * face, -60 * s, '#5a3a1e', 2.4 * s);
    line(c, -8 * s * face, -12 * s, -14 * s * face, -60 * s, INK, 0.01);
    c.save(); c.translate(-14 * s * face, -60 * s); c.rotate(sw);
    line(c, 0, 0, 0, 6 * s, INK, 1.4 * s);
    c.fillStyle = 'rgba(255,190,90,0.35)'; c.beginPath(); c.arc(0, 13 * s, 12 * s, 0, TAU); c.fill();
    cel(c, P.ell(0, 13 * s, 6 * s, 7.5 * s), '#ffcf6b', '#e08a2a', '#fff3c8', lw * 0.8, 2 * s);
    c.restore();
  }

  // ----- legs -----
  const lg = Math.sin(walk) * 4 * s;
  const pants = skin.trim === '#000000' ? '#2a2a33' : shade(skin.gi, -0.15);
  for (const [sx, off] of [[-1, lg], [1, -lg]]) {
    cel(c, P.rr(sx * 5 * s - 4 * s + off * 0.3, -15 * s, 8 * s, 13 * s, 3 * s), pants, shade(pants, -0.3), shade(pants, 0.35), lw, 2 * s);
    flat(c, P.ell(sx * 5 * s + off * 0.5, -1.5 * s, 5 * s, 2.6 * s), '#1a1720', lw * 0.8);
  }

  // ----- arms (behind torso when idle) -----
  const armUp = slam > 0 && slam < 0.45;
  const fistY = armUp ? -58 * s : slam >= 0.45 && slam < 1 ? -6 * s : -18 * s + Math.sin(walk + 1) * 2 * s;
  const fistX = armUp ? 6 * s : 15 * s;
  const sleeve = fx.has('armor') ? '#f2c14e' : skin.gi;
  for (const sd of [-1, 1]) {
    c.beginPath(); c.moveTo(sd * 9 * s, -26 * s); c.lineTo(sd * fistX, fistY);
    c.strokeStyle = INK; c.lineWidth = 8 * s; c.lineCap = 'round'; c.stroke();
    c.strokeStyle = sleeve; c.lineWidth = 4.6 * s; c.stroke();
  }

  // ----- torso -----
  const torso = P.poly([-10 * s, -29 * s, 10 * s, -29 * s, 12 * s, -13 * s, -12 * s, -13 * s]);
  cel(c, torso, skin.gi, skin.giS, shade(skin.gi, 0.4), lw, 3 * s);
  if (fx.has('armor')) {
    cel(c, P.ell(-10 * s, -27 * s, 6 * s, 4 * s), '#f2c14e', '#b5862a', '#fff2c2', lw * 0.8, 1.5 * s);
    cel(c, P.ell(10 * s, -27 * s, 6 * s, 4 * s), '#f2c14e', '#b5862a', '#fff2c2', lw * 0.8, 1.5 * s);
  }
  // lapel V
  c.beginPath(); c.moveTo(-6 * s, -29 * s); c.lineTo(0, -19 * s); c.lineTo(6 * s, -29 * s);
  c.strokeStyle = INK; c.lineWidth = 1.6 * s; c.stroke();
  // belt
  flat(c, P.rr(-12 * s, -16.5 * s, 24 * s, 4.5 * s, 1.5 * s), skin.trim, 1.6 * s);
  if (fx.has('bag')) {
    line(c, -9 * s, -29 * s, 9 * s, -14 * s, '#3d2a1a', 2.6 * s);
    cel(c, P.rr(5 * s, -17 * s, 10 * s, 8 * s, 2 * s), '#6b4a2a', '#43301b', '#a07850', lw * 0.8, 1.5 * s);
  }
  if (fx.has('core')) {
    const pulse = 0.7 + Math.sin(t * 6) * 0.3;
    c.fillStyle = `rgba(255,120,30,${0.35 * pulse})`; c.beginPath(); c.arc(0, -22 * s, 9 * s, 0, TAU); c.fill();
    cel(c, P.circ(0, -22 * s, 4 * s), '#ffb02e', '#ff5a1a', '#fff1b0', 1.6 * s, 1.2 * s);
    for (let i = 0; i < 4; i++) { const a = i * TAU / 4 + t; line(c, Math.cos(a) * 4.5 * s, -22 * s + Math.sin(a) * 4.5 * s, Math.cos(a) * 7 * s, -22 * s + Math.sin(a) * 7 * s, '#ff8a1f', 1.2 * s); }
  }
  if (fx.has('daggers')) {
    for (const sd of [-1, 1]) {
      c.save(); c.translate(sd * 12 * s, -12 * s); c.rotate(sd * 0.5);
      flat(c, P.poly([0, 0, 1.6 * s, 10 * s, 0, 13 * s, -1.6 * s, 10 * s]), '#d9d4f0', 1.4 * s);
      flat(c, P.rr(-2 * s, -3 * s, 4 * s, 3 * s, 1), '#b28cff', 1.2 * s);
      c.restore();
    }
  }
  // ----- fists -----
  for (const sd of [-1, 1]) {
    const fxp = sd * fistX, fyp = fistY;
    const wrap = skin.id === 'rookie' || skin.id === 'ember' ? '#efe2c4' : skin.skin;
    cel(c, P.circ(fxp, fyp, 4.6 * s), wrap, shade(wrap, -0.3), '#ffffff', lw * 0.9, 1.5 * s);
    if (skin.id === 'rookie') line(c, fxp - 3 * s, fyp - 1 * s, fxp + 3 * s, fyp + 1 * s, '#b9a57e', 1 * s);
    if (fx.has('flamefists')) {
      for (let i = 0; i < 3; i++) {
        const ph = t * 12 + i * 2 + sd;
        const fh = (5 + Math.sin(ph) * 2) * s;
        flat(c, P.poly([fxp - 3 * s + i * 3 * s, fyp - 2 * s, fxp - 1.5 * s + i * 3 * s, fyp - 2 * s - fh, fxp + i * 3 * s - 0 * s, fyp - 2 * s]), i === 1 ? '#ffd23d' : '#ff5a1a', 0);
      }
    }
    if (fx.has('chains')) {
      for (let i = 0; i < 3; i++) strokeP(c, P.ell(fxp + sd * 1 * s, fyp + 6 * s + i * 3.4 * s, 1.6 * s, 2.2 * s), '#8f8f99', 1.2 * s);
    }
  }

  // ----- head -----
  const look = face * 0.8;
  cel(c, P.circ(hx, hy, 12.5 * s), skinC, skinS, skinR, lw, 3 * s);
  // hair
  if (!fx.has('bald')) {
    const sp = fx.has('spiky') || fx.has('static') ? 1.5 : 1;
    const hp = [];
    const n = 7;
    for (let i = 0; i <= n; i++) {
      const a = Math.PI + (i / n) * Math.PI;
      const r1 = 13.5 * s, r2 = (17 + (i % 2 === 0 ? 4 * sp : 0)) * s;
      hp.push(hx + Math.cos(a) * (i % 2 ? r1 : r2), hy + Math.sin(a) * (i % 2 ? r1 : r2) - 1 * s);
    }
    hp.push(hx + 13 * s, hy + 1 * s, hx + 9 * s, hy - 6 * s, hx + 2 * s, hy - 4 * s, hx - 4 * s, hy - 7 * s, hx - 10 * s, hy - 3 * s, hx - 13 * s, hy + 2 * s);
    cel(c, P.poly(hp), skin.hair, skin.hairS, shade(skin.hair, 0.45), lw, 2.5 * s);
    // the rift streak: a single pale lock
    flat(c, P.poly([hx - 3 * s, hy - 13 * s, hx + 1 * s, hy - 19 * s, hx + 2 * s, hy - 6 * s]), '#cfc6ff', 1.2 * s);
  } else {
    flat(c, P.circ(hx, hy - 12 * s, 3 * s), skin.hair, 1.4 * s);
  }
  if (fx.has('headband')) {
    flat(c, P.rr(hx - 13 * s, hy - 8 * s, 26 * s, 4.5 * s, 1.5 * s), skin.band, 1.6 * s);
    const tw = Math.sin(t * 8) * 2 * s;
    flat(c, P.poly([hx - 12 * s * face, hy - 6 * s, hx - 24 * s * face, hy - 9 * s + tw, hx - 22 * s * face, hy - 3 * s + tw]), skin.band, 1.4 * s);
  }
  if (fx.has('goggles')) {
    flat(c, P.rr(hx - 13 * s, hy - 11 * s, 26 * s, 4 * s, 2 * s), '#2a2a33', 1.2 * s);
    cel(c, P.circ(hx - 5 * s, hy - 10 * s, 3.8 * s), '#6bf0ff', '#2a9fb3', '#ffffff', 1.6 * s, 1 * s);
    cel(c, P.circ(hx + 5 * s, hy - 10 * s, 3.8 * s), '#6bf0ff', '#2a9fb3', '#ffffff', 1.6 * s, 1 * s);
  }
  // eyes
  const sleepy = fx.has('sleepy') ? skinC : null;
  const iris = fx.has('halfvoid') ? '#9c8cff' : fx.has('glitch') ? '#ff2bd6' : '#3a2a5e';
  animeEye(c, hx - 4.5 * s + look, hy + 1 * s, s, iris, face * 0.5, sleepy);
  animeEye(c, hx + 4.5 * s + look, hy + 1 * s, s, iris, face * 0.5, sleepy);
  line(c, hx - 1.5 * s + look, hy + 7 * s, hx + 1.5 * s + look, hy + 7 * s, INK, 1.3 * s);
  // rift marks: Kai becomes a little more like the things he fights
  const rift = o.rift || 0;
  if (rift > 0.02) {
    c.save(); c.globalAlpha = 0.5 + rift * 0.5;
    c.strokeStyle = '#c9bfff'; c.lineWidth = 1.2 * s; c.lineCap = 'round';
    c.beginPath();
    const L = 3 + rift * 9;
    c.moveTo(hx - 9 * s, hy + 2 * s); c.lineTo(hx - 7 * s, hy + 2 * s + L * 0.3 * s); c.lineTo(hx - 10 * s, hy + 2 * s + L * 0.6 * s);
    if (rift > 0.4) { c.moveTo(-9 * s, -26 * s); c.lineTo(-6 * s, -22 * s); c.lineTo(-9 * s, -18 * s); }
    c.stroke(); c.restore();
  }
  if (fx.has('crown')) {
    const cb = Math.sin(t * 2.5) * 2 * s;
    cel(c, P.poly([hx - 9 * s, hy - 24 * s + cb, hx - 9 * s, hy - 32 * s + cb, hx - 4.5 * s, hy - 27 * s + cb, hx, hy - 34 * s + cb, hx + 4.5 * s, hy - 27 * s + cb, hx + 9 * s, hy - 32 * s + cb, hx + 9 * s, hy - 24 * s + cb]), '#ffd23d', '#c9961a', '#fff7cf', lw * 0.8, 1.5 * s);
  }
  if (fx.has('halfvoid')) {
    c.save(); c.beginPath(); c.rect(0, -80 * s, 40 * s, 82 * s); c.clip();
    flat(c, torso, '#05040a', lw);
    flat(c, P.circ(hx, hy, 12.5 * s), '#05040a', lw);
    c.restore();
    c.save(); c.strokeStyle = '#ffffff'; c.lineWidth = 1 * s;
    c.beginPath(); c.moveTo(0, -56 * s); c.lineTo(2 * s, -40 * s); c.lineTo(-1 * s, -28 * s); c.lineTo(2 * s, -14 * s); c.lineTo(0, 0); c.stroke();
    flat(c, P.circ(hx + 4.5 * s + look, hy + 1 * s, 2.2 * s), '#ffffff', 0);
    c.restore();
  }
  if (fx.has('static') && Math.sin(t * 17) > 0.2) {
    c.strokeStyle = '#fff36b'; c.lineWidth = 1.4 * s;
    for (let i = 0; i < 2; i++) {
      const a = t * 9 + i * 3;
      const r = 20 * s;
      c.beginPath(); c.moveTo(hx + Math.cos(a) * r, hy + Math.sin(a) * r);
      c.lineTo(hx + Math.cos(a + 0.3) * (r + 5 * s), hy + Math.sin(a + 0.3) * (r - 4 * s));
      c.lineTo(hx + Math.cos(a + 0.5) * (r + 1 * s), hy + Math.sin(a + 0.5) * (r + 4 * s));
      c.stroke();
    }
  }
  if (fx.has('mist') && (t % 2.2) < 0.9) {
    const k = (t % 2.2) / 0.9;
    c.fillStyle = `rgba(230,245,255,${0.6 * (1 - k)})`;
    c.beginPath(); c.arc(hx + face * (6 + k * 8) * s, hy + 7 * s - k * 4 * s, (2 + k * 4) * s, 0, TAU); c.fill();
  }
  c.restore();
  if (fx.has('waterring')) {
    c.save(); c.strokeStyle = 'rgba(140,240,230,0.8)'; c.lineWidth = 2 * s;
    c.beginPath(); c.ellipse(0, -22 * s, 22 * s, 7 * s, 0, 0, TAU); c.stroke();
    for (let i = 0; i < 3; i++) { const a = t * 2 + i * TAU / 3; flat(c, P.circ(Math.cos(a) * 22 * s, -22 * s + Math.sin(a) * 7 * s, 2.2 * s), '#bff9f0', 1 * s); }
    c.restore();
  }
  if (fx.has('glitch')) {
    c.save(); c.globalAlpha = 0.7;
    const g = Math.sin(t * 23) > 0.6 ? 3 : 1.5;
    c.strokeStyle = '#2bf0ff'; c.lineWidth = 1.5 * s;
    c.strokeRect(-14 * s - g, -56 * s, 28 * s, 56 * s);
    c.strokeStyle = '#ff2bd6'; c.strokeRect(-14 * s + g, -56 * s + g, 28 * s, 56 * s);
    c.restore();
  }
}

// lighten (+) / darken (-) a hex color
function shade(hex, amt) {
  if (hex[0] !== '#') return hex;
  let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  const h = v => ('0' + Math.round(clamp(v, 0, 255)).toString(16)).slice(-2);
  return '#' + h(r) + h(g) + h(b);
}

// ============================================================================
// ENEMIES
// ============================================================================
const ENEMY_LOOK = {
  slime: { c: '#36d6b5', s: '#1d8f80', r: '#c9fff2' },
  husk: { c: '#5a5a68', s: '#34343e', r: '#a9a9bb' },
  oni: { c: '#c2262e', s: '#7a1218', r: '#ff8a8f' },
  drone: { c: '#c9a24a', s: '#8a6a25', r: '#fff0b8' },
  ghost: { c: '#c06bff', s: '#7a2fd0', r: '#ffd6ff' },
  crawler: { c: '#121018', s: '#050408', r: '#ffffff' },
  runner: { c: '#7bb36a', s: '#4e7a40', r: '#d8ffcc' },
  shade: { c: '#2bf0ff', s: '#1197a6', r: '#d8fdff' },
  twin: { c: '#14121c', s: '#06050a', r: '#ffffff' },
};
function drawEnemy(c, type, r, o) {
  o = o || {};
  const L = ENEMY_LOOK[type] || ENEMY_LOOK.slime;
  const s = r / 22, lw = 2.6 * s;
  if (o.elite) { c.shadowColor = '#ffd23d'; c.shadowBlur = 12 * s; }
  switch (type) {
    case 'slime': {
      const body = c2 => { c2.moveTo(-21 * s, 14 * s); c2.bezierCurveTo(-24 * s, -8 * s, -12 * s, -22 * s, 0, -22 * s); c2.bezierCurveTo(12 * s, -22 * s, 24 * s, -8 * s, 21 * s, 14 * s); c2.quadraticCurveTo(0, 20 * s, -21 * s, 14 * s); c2.closePath(); };
      cel(c, body, L.c, L.s, L.r, lw, 4 * s);
      flat(c, P.ell(-9 * s, -12 * s, 4 * s, 2.5 * s, -0.5), 'rgba(255,255,255,0.8)', 0);
      flat(c, P.ell(-6 * s, -3 * s, 3 * s, 4.2 * s), INK, 0); flat(c, P.ell(6 * s, -3 * s, 3 * s, 4.2 * s), INK, 0);
      flat(c, P.circ(-7 * s, -5 * s, 1.2 * s), '#fff', 0); flat(c, P.circ(5 * s, -5 * s, 1.2 * s), '#fff', 0);
      flat(c, P.ell(14 * s, 15 * s, 2.5 * s, 4 * s), L.c, lw * 0.6);
      break;
    }
    case 'husk': {
      if (!o.broken) {
        cel(c, P.rr(-16 * s, -18 * s, 32 * s, 36 * s, 8 * s), L.c, L.s, L.r, lw, 3 * s);
        cel(c, P.circ(0, 4 * s, 15 * s), '#7d7f8c', '#4c4d57', '#e6e8f5', lw, 3 * s);
        strokeP(c, P.circ(0, 4 * s, 9 * s), INK, 1.6 * s);
        flat(c, P.circ(0, 4 * s, 3 * s), '#b9bccb', 1.4 * s);
      } else {
        cel(c, P.rr(-16 * s, -18 * s, 32 * s, 36 * s, 8 * s), L.c, L.s, L.r, lw, 3 * s);
        flat(c, P.poly([-12 * s, 6 * s, -2 * s, 0, -6 * s, 16 * s]), '#7d7f8c', lw * 0.7);
      }
      cel(c, P.rr(-13 * s, -27 * s, 26 * s, 16 * s, 6 * s), '#3b3b47', '#24242c', '#8b8b9e', lw, 2 * s);
      flat(c, P.rr(-9 * s, -21 * s, 18 * s, 3.4 * s, 1.5 * s), '#ff3b3b', 0);
      break;
    }
    case 'oni': {
      for (const sd of [-1, 1]) cel(c, P.poly([sd * 9 * s, -16 * s, sd * 18 * s, -32 * s, sd * 15 * s, -14 * s]), '#f2ead6', '#b8ad92', null, lw * 0.9, 1.5 * s);
      cel(c, P.ell(0, 0, 21 * s, 19 * s), L.c, L.s, L.r, lw, 4 * s);
      flat(c, P.poly([-12 * s, -6 * s, -3 * s, -3 * s, -12 * s, -2 * s]), '#ffd23d', 1.2 * s);
      flat(c, P.poly([12 * s, -6 * s, 3 * s, -3 * s, 12 * s, -2 * s]), '#ffd23d', 1.2 * s);
      flat(c, P.rr(-11 * s, 5 * s, 22 * s, 7 * s, 3 * s), INK, 0);
      flat(c, P.poly([-8 * s, 6 * s, -6 * s, 1 * s, -4 * s, 6 * s]), '#fff', 0);
      flat(c, P.poly([4 * s, 6 * s, 6 * s, 1 * s, 8 * s, 6 * s]), '#fff', 0);
      break;
    }
    case 'drone': {
      cel(c, P.circ(0, 0, 16 * s), L.c, L.s, L.r, lw, 3.5 * s);
      flat(c, P.rr(-3 * s, -24 * s, 6 * s, 8 * s, 2 * s), '#5a4a2a', lw * 0.7);
      flat(c, P.rr(-12 * s, -27 * s, 24 * s, 4 * s, 2 * s), '#8a8a95', lw * 0.7);
      c.shadowColor = '#ffb02e'; c.shadowBlur = 8 * s;
      flat(c, P.circ(0, 1 * s, 6.5 * s), '#ff9a1a', lw * 0.8);
      c.shadowBlur = 0;
      flat(c, P.circ(0, 1 * s, 2.6 * s), '#fff3c4', 0);
      break;
    }
    case 'ghost': {

    }

    }

// ---------------------------------------------------------------------------
// Soldier: ~48px tall at s=1, feet at (0,0). back=true for the chase camera.
// ---------------------------------------------------------------------------
function drawSoldier(c, skin, s, back, frame) {

    cel(c, P.rr(sd * 4.5 * s - 3.5 * s, -14 * s - Math.max(0, off) * 0.3, 7 * s, 13 * s + Math.max(0, off) * 0.3, 2.5 * s), legC, shade(legC, -0.35), shade(legC, 0.3), lw, 1.6 * s);

  }

  const torso = P.poly([-9 * s, -31 * s, 9 * s, -31 * s, 10.5 * s, -13 * s, -10.5 * s, -13 * s]);
  if (!back && fx.has('wings')) for (const sd of [-1, 1]) cel(c, P.ell(sd * 12 * s, -26 * s, 9 * s, 6 * s, sd * 0.5), '#b6aedc', '#7d74a6', '#f2ecff', lw, 1.5 * s);

  flat(c, P.rr(-10.5 * s, -16 * s, 21 * s, 3.4 * s, 1.2 * s), skin.t === '#000000' ? '#2a2a33' : shade(skin.c2, -0.3), 1.2 * s);

function drawGate(c, x0, x1, yTop, yBot, g, s, alpha, picked, result) {
  const col = gateColor(g);
  const w = x1 - x0, h = yBot - yTop;
  c.save();
  c.globalAlpha = alpha;
  // panel
  const grd = c.createLinearGradient(0, yTop, 0, yBot);
  grd.addColorStop(0, col + 'e6'); grd.addColorStop(1, col + '55');
  c.fillStyle = grd; c.fillRect(x0 + 2 * s, yTop, w - 4 * s, h);
  c.strokeStyle = picked ? '#ffffff' : shade(col, 0.5); c.lineWidth = Math.max(1.5, (picked ? 5 : 3) * s);
  c.strokeRect(x0 + 2 * s, yTop, w - 4 * s, h);
  // posts
  for (const x of [x0, x1]) { c.fillStyle = INK; c.fillRect(x - 3 * s, yTop - 6 * s, 6 * s, h + 6 * s); c.fillStyle = '#e6e8f2'; c.fillRect(x - 1.6 * s, yTop - 6 * s, 3.2 * s, h + 6 * s); }
  // label: one op, or two stacked for a compound gate
  const lines = g.label;
  // numbers stay readable from the full approach distance: never smaller than ~22px
  const natural = Math.min(w * 0.36, h * (lines.length > 1 ? 0.3 : 0.42)) * (lines.length > 1 ? 1 : 1.15);
  const px = Math.max(natural, lines.length > 1 ? 19 : 24);
  const maxW = Math.max(w * 0.9, px * 2.6);
  const cy = yTop + h * 0.46;
  if (lines.length === 1) bigText(c, lines[0], (x0 + x1) / 2, cy, px, '#ffffff', { maxW });
  else lines.forEach((l, i) => bigText(c, l, (x0 + x1) / 2, cy + (i - 0.5) * px * 1.02, px, '#ffffff', { maxW }));
  if (result != null) bigText(c, '= ' + fmtInt(result), (x0 + x1) / 2, cy + px * (lines.length > 1 ? 1.4 : 0.95), Math.max(12, px * 0.5), '#fff7c2', { maxW });
  c.restore();
}

    flat(c, P.rr(sd * 120 * s - 6 * s, -wallH - 40 * s, 12 * s, 18 * s, 2 * s), '#1a1720', 0);
    // banner
    flat(c, P.poly([sd * 120 * s - 4 * s, -wallH - 110 * s, sd * 120 * s + 22 * s * sd, -wallH - 102 * s + Math.sin(t * 4 + sd) * 3 * s, sd * 120 * s - 4 * s, -wallH - 94 * s]), pal.accent, lw * 0.6);
    line(c, sd * 120 * s - 4 * s, -wallH - 110 * s, sd * 120 * s - 4 * s, -wallH - 70 * s, INK, 2 * s);
  }
  // wall
  cel(c, P.rr(-wallW / 2, -wallH, wallW, wallH, 3 * s), '#6e6874', '#4a4550', '#a8a2ae', lw, 5 * s);
  for (let i = 0; i < 12; i++) flat(c, P.rr(-wallW / 2 + i * 25.5 * s, -wallH - 12 * s, 14 * s, 13 * s, 2 * s), '#6e6874', lw * 0.8);
  c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1.5 * s;
  for (let y = 1; y < 4; y++) { c.beginPath(); c.moveTo(-wallW / 2, -wallH + y * wallH / 4); c.lineTo(wallW / 2, -wallH + y * wallH / 4); c.stroke(); }
  // gate
  cel(c, P.rr(-34 * s, -54 * s, 68 * s, 54 * s, 26 * s), '#3a2416', '#24160c', '#6a4a30', lw, 3 * s);
  for (let i = -2; i <= 2; i++) line(c, i * 12 * s, -50 * s, i * 12 * s, 0, '#24160c', 2 * s);
  // defenders on the wall, firing
  for (let i = 0; i < 7; i++) {
    const x = -wallW / 2 + 22 * s + i * 43 * s;
    flat(c, P.circ(x, -wallH - 18 * s, 5 * s), '#2a2030', lw * 0.6);
    flat(c, P.rr(x - 5 * s, -wallH - 14 * s, 10 * s, 8 * s, 2 * s), '#2a2030', 0);

  if (dmg > 0.2) {

    for (let i = 0; i < n; i++) { const x = -wallW / 2 + ((i * 97) % 280) * s + 10 * s; c.moveTo(x, -wallH); c.lineTo(x + 8 * s, -wallH + 22 * s); c.lineTo(x - 4 * s, -wallH + 44 * s); }

  bigText(c, fmtHP(hp), 0, -wallH - 168 * s + ph / 2, 38 * s, dmg > 0.75 ? '#ff9aa9' : '#ffffff', { maxW: 168 * s });
  c.restore();
}

// ---- 40-game.js ----
// ============================================================================
// GAME: world, squad, gates, combat, base assault, bosses
// World units: x across the road (-5..5), z along it. The leader runs at z = G.P.
// ============================================================================

const ROAD = 5;           // road half-width
const LEAD_DEPTH = 9;     // camera sits this far behind the leader
const RANGE = 48;         // squad fires at targets up to this far ahead
const V = {};

function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  let st = 0, sb = 0;
  const probe = document.getElementById('safe');
  if (probe) { const cs = getComputedStyle(probe); st = parseFloat(cs.paddingTop) || 0; sb = parseFloat(cs.paddingBottom) || 0; }
  V.w = w; V.h = h; V.top = st; V.bot = h - sb;
  V.hudY = V.top + 6;
  V.horizon = V.top + (V.bot - V.top) * 0.2;
  const leadY = V.top + (V.bot - V.top) * 0.64;
  V.F = 0.46 * w * LEAD_DEPTH / ROAD;                 // road half-width at the leader = 46% of screen
  V.camH = (leadY - V.horizon) * LEAD_DEPTH / V.F;
  V.cx = w / 2;
  V.pause = { x: 8, y: V.hudY, w: 44, h: 44 };
}
// project world (x, z, height) to screen
function proj(x, z, y) {
  const d = Math.max(0.6, z - (G.P - LEAD_DEPTH));
  const s = V.F / d;
  return { x: V.cx + (x - G.camX) * s, y: V.horizon + (V.camH - (y || 0)) * s, s, d };
}

const G = {
  mode: 'menu', t: 0, P: 0, camX: 0, timeScale: 1, shake: 0, flash: 0, flashCol: '#fff', push: 0,
  lead: { x: 0, tx: 0, vx: 0 }, N: 10, bodies: [],
  gates: [], enemies: [], bars: [], coins: [], picks: [], hazards: [], tracers: [], parts: [], texts: [], rings: [],
};
const hasRelic = id => G.relics && G.relics.includes(id);

// ---------------------------------------------------------------------------
// Runs and levels
// ---------------------------------------------------------------------------
function newRun(loop) {
  Store.d.run = { level: 1, coins: 0, relics: [], loop: loop || 0, cards: null };
  Store.save();
}
function startSoldiers() { return BAL.startSoldiers + 3 * shopLvl('reinf') + (hasRelic('quarter') ? 3 : 0) + (G.mods && G.mods.plus8 ? 8 : 0); }

function startLevel() {
  const run = Store.d.run, L = run.level;
  G.level = L; G.stage = stageOf(L); G.loop = run.loop || 0;
  G.relics = (run.relics || []).slice();
  G.mods = run.cards || {}; run.cards = null;
  const tune = levelTuning(L);
  G.dmg = tune.dmg;
  G.baseMax = Math.round(tune.baseHP * Math.pow(1.35, G.loop) * (L === 1 ? 0.6 : 1)); // L1 teaches, it doesn't test
  G.timerMax = tune.timer;
  G.v = BAL.runSpeed * speedMult(L);
  G.Lr = roadSeconds(L) * G.v;
  G.P = 0; G.camX = 0; G.lt = 0;
  G.lead = { x: 0, tx: 0, vx: 0 };
  G.N = startSoldiers(); G.Nmax = G.N; G.shownN = G.N; G.punch = 0;
  G.gates = []; G.enemies = []; G.bars = []; G.coins = []; G.picks = []; G.hazards = []; G.tracers = []; G.parts = []; G.texts = []; G.rings = [];
  G.salvoT = 0.6; G.buff = null; G.debuff = null; G.patientT = 0; G.streak = 0;
  G.vanguardAcc = 0; G.medicLeft = shopLvl('medic'); G.rallyUsed = false; G.lossAcc = 0;
  G.stats = { coins: 0, exact: 0, kills: 0, gems: 0, relic: false, bestStreak: 0 };
  G.phase = 'run'; G.base = null; G.boss = null; G.squeezed = false;
  G.timeScale = 1; G.slowT = 0; G.shake = 0; G.flash = 0; G.push = 0;
  G.tut = (L === 1 && !Store.d.tut.base) ? { step: 0, t: 0 } : null;
  G.banner = { title: 'LEVEL ' + L, sub: STAGES[G.stage - 1].short.toUpperCase(), t: 0, max: 2 };
  buildLevel();
  layoutBodies(true);
  G.mode = 'play';
  Music.play(G.stage - 1);
}

// Lay out gates, enemies, barricades and coins along the road.
function buildLevel() {
  const L = G.level, v = G.v, Lr = G.Lr, st = G.stage;
  const sets = gateSetsFor(L);
  const first = (G.tut ? 7 : 5) * v, last = Lr - 4 * v;
  const gz = [];
  for (let i = 0; i < sets; i++) gz.push(first + (last - first) * (sets === 1 ? 0 : i / (sets - 1)));
  if (G.tut) { gz[0] = 7 * v; gz[1] = 11.5 * v; }
  G.gates = gz.map((z, i) => ({ z, set: null, done: false, tut: G.tut ? (i === 0 ? 'obvious' : i === 1 ? 'real' : null) : null }));
  // segments between gates hold the fighting
  const segs = [];
  for (let i = 0; i < gz.length; i++) segs.push([gz[i] + 1.4 * v, (i + 1 < gz.length ? gz[i + 1] : Lr) - 1.4 * v]);
  if (G.tut) { segs[0][0] = 16 * v; } // keep the teaching stretch clean
  const E = enemiesFor(L);
  const hp = enemyHP(L, G.loop);
  const lanes = [-4, -2, 0, 2, 4];
  let placed = 0;
  const per = Math.ceil(E / segs.length);
  for (let si = 0; si < segs.length; si++) {
    const [a, b] = segs[si];
    if (b - a < 4) continue;
    let z = a + rand(0, 2);

// Damage

function dmgBonus(vsBase) {

}

}

}

}

// ---------------------------------------------------------------------------
// Gates
// ---------------------------------------------------------------------------

  const gate = g.set[idx];
  g.picked = idx;
  let ops = gate.ops.map(o => ({ ...o }));
  let note = '';

  if (ops.some(o => o.k === 'mul') && hasRelic('twin') && Math.random() < 0.05) { ops = ops.flatMap(o => (o.k === 'mul' ? [o, o] : [o])); note = 'TWIN! '; }

// ---------------------------------------------------------------------------
// Enemies on the road
// ---------------------------------------------------------------------------
function updateEnemies(dt) {
  const fh = formHalf();
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.t += dt; e.flash = Math.max(0, e.flash - dt);
    const d = e.z - G.P;
    if (!e.active) { if (d < 55) e.active = true; else continue; }
    // ghosts strafe across lanes unpredictably
    if (e.look === 'ghost') { if (Math.random() < dt * 0.8) e.strafe = rand(-1, 1); e.x = clamp(e.x + e.strafe * 3.2 * dt, -4.6, 4.6); }
    // crawlers blink out, but are always visible 1.5s+ before contact

    }
    if (e.leap) {

      const k = Math.min(1, e.leap.t);
      e.x = lerp(e.leap.x0, e.leap.x1, k); e.z = lerp(e.leap.z0, e.leap.z1, k); e.y = Math.sin(k * Math.PI) * 3.5;
      if (k >= 1) {
        e.dead = true;
        if (Math.abs(G.lead.x - e.x) < fh) { contact(e); worldBurst(e.x, e.z, 0.4, 14, '#ff3b5c', 5); }
        else { worldPuff(e.x, e.z, 0.3, '#cccccc'); floatText(e.x, e.z, 1.5, 'MISSED', '#dddddd', 15); }
      }
      continue;
    }
    let sp = e.speed;
    if (e.kind === 'brute' && e.look === 'oni') sp *= (e.t % 3) < 0.7 ? 3 : 0.6; // charging bursts
    e.z -= sp * dt;

    if (e.z - G.P < 0.5) {

    }

}
function contact(e) {

  if (boss) {
    const kinds = ['brine', 'gorebrand', 'tyrant', 'echo', 'otherkai'];
    G.boss = { kind: kinds[G.stage - 1], atkT: 3, wind: 0, zone: null, flash: 0, plates: 4, slamAnim: 0, swingT: 0, mirror: G.N, rivalT: 6, hp: G.baseMax, maxHp: G.baseMax };
    G.nameCard = { name: STAGES[G.stage - 1].boss, sub: STAGES[G.stage - 1].bossSub, t: 0, max: 2.4 };

}
function updateAssault(dt) {

        for (let i = 0; i < 8; i++) G.tracers.push({ x0: rand(-4, 4), z0: B.z - 1, y0: 3, x1: rand(B.zone[0], B.zone[1]), z1: G.P, t: 0.14, enemy: true });

      if (B.barT <= 0) {
        const w = ROAD * 2 * 0.4;
        const x0 = clamp(G.lead.x - w / 2 + rand(-1.5, 1.5), -ROAD, ROAD - w);
        B.zone = [x0, x0 + w]; B.wind = 0.8;

}
function updateBoss(dt) {

      if (hi > lo) { loseSoldiers(Math.max(1, Math.ceil(G.N * BAL.bossHit * Math.min(1, (hi - lo) / Math.min(2 * fh, b.zone[1] - b.zone[0]))))); floatText(G.lead.x, G.P, 3, 'HIT!', '#ff3b5c', 24); }

      r.hp = r.maxHp = Math.max(2, G.N * G.dmg); r.kill = Math.max(1, Math.ceil(G.N * 0.25)); r.active = true; r.speed = 4; r.r = 1;

function updateEnemiesAssault(dt) {
  G.salvoE = (G.salvoE || 0) - dt;
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.z -= e.speed * dt; e.t += dt; e.flash = Math.max(0, e.flash - dt);
    if (G.salvoE <= 0) { damageEnemy(e, volley(false)); muzzle({ e }); G.salvoE = 0.5; }

// FX
// ---------------------------------------------------------------------------
function worldBurst(x, z, y, n, col, sp) {
  for (let i = 0; i < n; i++) G.parts.push({ kind: 'spark', x, z, y, vx: rand(-sp, sp), vz: rand(-sp, sp) * 0.5, vy: rand(0, sp), life: rand(0.3, 0.6), max: 0.6, size: rand(0.08, 0.2), col });
}
function worldPuff(x, z, y, col) { for (let i = 0; i < 3; i++) G.parts.push({ kind: 'puff', x: x + rand(-0.2, 0.2), z, y: y + rand(-0.2, 0.2), life: 0.3, max: 0.3, size: rand(0.25, 0.45), col }); }
function floatText(x, z, y, text, col, size) { G.texts.push({ x, z, y, text: String(text), col, size: size || 18, life: 1, max: 1 }); }
const HUD = { coinPulse: 0, plus: [], gemPulse: 0 };
function updateFx(dt) {
  for (const p of G.parts) {
    if (p.kind === 'gem') {
      if (p.delay > 0) { p.delay -= dt; p.vy += 700 * dt; p.sx += p.vx * dt; p.sy += p.vy * dt; continue; }
      const dx = HUD.gemX - p.sx, dy = HUD.gemY - p.sy, d = Math.hypot(dx, dy) || 1;
      const sp = 1400 * dt; p.sx += dx / d * Math.min(d, sp); p.sy += dy / d * Math.min(d, sp);
      if (d < 10) { p.life = 0; HUD.gemPulse = 1; SFX.gem(p.i); }
      continue;
    }
    p.life -= dt;
    if (p.kind === 'spark') { p.x += p.vx * dt; p.z += p.vz * dt; p.y = Math.max(0, p.y + p.vy * dt); p.vy -= 18 * dt; }
    else if (p.kind === 'puff') p.y += dt * 1.5;
    else if (p.kind === 'fall') { p.y += p.vy * dt; p.vy -= 20 * dt; p.x += p.vx * dt; }
    else if (p.kind === 'coinfly') p.y += dt * 8;
    else if (p.kind === 'confetti') { p.sy += p.vy * dt; p.sx += p.vx * dt; p.vy += 200 * dt; p.rot += p.vr * dt; }
  }
  G.parts = G.parts.filter(p => p.life > 0);
  if (G.parts.length > 600) G.parts.splice(0, G.parts.length - 600);
  for (const t of G.texts) { t.life -= dt; t.y += dt * 1.6; }
  G.texts = G.texts.filter(t => t.life > 0);
  for (const t of G.tracers) t.t -= dt;
  G.tracers = G.tracers.filter(t => t.t > 0);
  G.shake = Math.max(0, G.shake - dt * 40);
  G.flash = Math.max(0, G.flash - dt * 2.2);
  G.punch = Math.max(0, (G.punch || 0) - dt * 2.5);
  HUD.coinPulse = Math.max(0, HUD.coinPulse - dt * 5);
  HUD.gemPulse = Math.max(0, HUD.gemPulse - dt * 4);
  for (const p of HUD.plus) p.t += dt;
  HUD.plus = HUD.plus.filter(p => p.t < 0.9).slice(-4);
  for (const b of G.bodies) { b.pop = Math.max(0, b.pop - dt * 3); }
}

// ---------------------------------------------------------------------------
// Main update
// ---------------------------------------------------------------------------
function updateSteer(dt) {
  const l = G.lead;
  const spd = 9 * (1 + 0.1 * shopLvl('steady')) * (G.debuff && G.debuff.id === 'steer' ? 0.75 : 1);
  l.tx = clamp(l.tx, -ROAD + 0.4, ROAD - 0.4);
  const want = clamp((l.tx - l.x) * 9, -spd, spd);
  l.vx = lerp(l.vx, want, 1 - Math.exp(-dt * 14));
  l.x = clamp(l.x + l.vx * dt, -ROAD + 0.4, ROAD - 0.4);
  // soldiers follow with a little lag; further back = heavier
  for (const b of G.bodies) {
    const k = 12 / (1 + b.row * 0.35);
    b.x += (l.x + b.ox - b.x) * (1 - Math.exp(-dt * k));
  }
  G.camX = lerp(G.camX, l.x * 0.45, 1 - Math.exp(-dt * 4));
}
function update(dt) {
  G.t += dt;
  updateFx(dt);
  if (G.mode !== 'play') return;
  G.lt += dt;
  if (G.slowT > 0) { G.slowT -= dt / Math.max(0.05, G.timeScale); if (G.slowT <= 0) G.timeScale = 1; }
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.max) G.banner = null; }
  if (G.nameCard) { G.nameCard.t += dt; if (G.nameCard.t > G.nameCard.max) G.nameCard = null; }
  if (G.buff) { G.buff.t -= dt; if (G.buff.t <= 0) { G.buff = null; layoutBodies(false); } }
  if (G.debuff) { G.debuff.t -= dt; if (G.debuff.t <= 0) { G.debuff = null; layoutBodies(false); } }
  if (!G.debuff) G.patientT += dt;
  updateSteer(dt);
  if (G.tut) updateTutorial(dt);
  if (G.phase === 'run') {
    G.P += G.v * dt;
    for (const b of G.bodies) b.frame = (b.frame + dt * 9) % 4;
    G.runFrame = ((G.runFrame || 0) + dt * 9) % 4;
    updateGates();
    updateEnemies(dt);
    updateBars();
    updateCoins(dt);
    updatePicks(dt);
    updateHazards(dt);
    G.salvoT -= dt;
    if (G.salvoT <= 0) { G.salvoT += 1 / fireRate(); shoot(); }
    if (G.P >= G.runnerAt) {
      G.runnerAt = Infinity;
      const e = addEnemy('treasure', 0, G.P + 26, enemyHP(G.level, G.loop), false, { look: 'treasure' });
      e.active = true; e.runT = 0; e.fromX = pick([-1, 1]) * 5.5; e.x = e.fromX;
      floatText(0, e.z, 3, 'TREASURE!', '#ffd23d', 24); SFX.tile();
    }
    if (G.P >= G.goldAt) { G.goldAt = Infinity; G.picks.push({ kind: 'gold', id: pick(Object.keys(BUFFS)), x: rand(-3, 3), z: G.P + 40, done: false, drift: 1, born: G.lt }); floatText(0, G.P + 40, 4, 'GOLD', '#ffd23d', 28); SFX.warn(); }
    if (G.P >= G.forceDebuffAt) { G.forceDebuffAt = Infinity; const was = G.picks.length; dropPickup('debuff'); if (G.picks.length > was) { const p = G.picks[G.picks.length - 1]; p.id = 'rate'; p.x = clamp(G.lead.x, -3, 3); if (G.tut) { p.z = G.P + 4.5 * G.v; G.tut.step = 3; } } }
    if (G.P >= G.corruptAt) {
      G.corruptAt = G.P + rand(18, 26) * G.v / 2;
      const w = randi(1, 3) * 2, x0 = pick([-5, -3, -1, 1, 3].filter(x => x + w <= 5 - 2)); // never the full width
      G.hazards.push({ x0, x1: x0 + w, t: 0, warn: 3, active: false, dur: 10, kind: 'corrupt' });
    }
    if (G.P >= G.Lr) { G.P = G.Lr; startAssault(); }
  } else if (G.phase === 'assault') {
    updateAssault(dt);
    updateHazards(dt);
  } else if (G.phase === 'done') {
    G.push = Math.min(1, G.push + dt * 1.2);
    G.doneT -= dt;
    if (G.doneT <= 0) levelComplete();
  }
}

function updateTutorial(dt) {
  const T = G.tut;
  T.t += dt;
  if (T.step >= 4 && G.P > 24 * G.v) { Store.d.tut.base = true; Store.save(); G.tut = null; }
}

// ---------------------------------------------------------------------------
// Level complete
// ---------------------------------------------------------------------------
function levelComplete() {
  G.mode = 'clear';
  const L = G.level, run = Store.d.run, d = Store.d;
  const rec = d.records[L] || 0;
  let bonus = 0;
  if (G.stats.exact > rec && G.stats.exact > 0) { bonus = G.stats.exact * coinsPerKill(L) * 5; d.records[L] = G.stats.exact; }
  const mult = +(1 + Math.min(2, G.N / 100)).toFixed(2);
  const total = Math.round((G.stats.coins + bonus) * mult);
  const skin = SKINS.find(s => s.unlock === L && !d.skinsOwned.includes(s.id));
  if (skin) d.skinsOwned.push(skin.id);
  if (isStageBoss(L) && !d.story.includes('post' + G.stage)) d.story.push('post' + G.stage);
  d.best = Math.max(d.best, L);
  run.coins = (run.coins || 0) + total;
  d.bestScore = Math.max(d.bestScore || 0, run.coins);
  run.relics = G.relics.slice();
  run.level = L + 1;
  if (L === 40) { d.runsDone = (d.runsDone || 0) + 1; d.loop = (run.loop || 0) + 1; }
  Store.save();
  SFX.clear();
  celebrate(L, isStageBoss(L));
  UI.levelClear({ level: L, coins: G.stats.coins, bonus, mult, total, squad: G.N, exact: G.stats.exact, record: rec, gems: G.stats.gems, relic: G.stats.relic, skin, stageClear: isStageBoss(L), ending: L === 40, streak: G.stats.bestStreak, score: run.coins });
}
function celebrate(L, big) {
  const n = 40 + L * 5 + (big ? 120 : 0);
  const cols = ['#ffd23d', '#ff3b5c', '#2de1c2', '#7ad7ff', '#ff4fb8', '#ffffff'];
  for (let i = 0; i < n; i++) G.parts.push({ kind: 'confetti', sx: rand(0, V.w), sy: rand(-200, -10), vx: rand(-60, 60), vy: rand(60, 240), life: rand(2, 3.5) + L * 0.03, max: 3.5, size: rand(4, 9), col: pick(cols), rot: rand(0, TAU), vr: rand(-8, 8) });
}

// ---- 50-input.js ----
// ============================================================================
// INPUT: touch anywhere and drag left/right to steer. Relative drag, so the
// thumb never covers the leader. No tap-to-shoot, no jump, no brake.
// ============================================================================

const Steer = { id: null, x0: 0, tx0: 0 };
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function onDown(ev) {
  ev.preventDefault();
  AudioSys.unlock();
  if (G.mode !== 'play') return;
  const x = ev.clientX, y = ev.clientY;
  if (inRect(x, y, { x: V.pause.x - 6, y: V.pause.y - 6, w: V.pause.w + 12, h: V.pause.h + 12 })) { UI.pause(); return; }
  try { ev.target.setPointerCapture(ev.pointerId); } catch (e) {}
  Steer.id = ev.pointerId; Steer.x0 = x; Steer.tx0 = G.lead.tx;
}
function onMove(ev) {

  const stop = e => e.preventDefault();
  document.addEventListener('gesturestart', stop, { passive: false });
  document.addEventListener('gesturechange', stop, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('contextmenu', stop, { passive: false });
  document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.scroll')) e.preventDefault(); }, { passive: false });

// ============================================================================
// RENDER: fake-3D chase camera. Road recedes to a vanishing point, sprites
// scale with distance, scenery at the edges slides past faster.
// ============================================================================
let CV = null, CX = null;
const SKY = { key: '', cv: null };
const MENU = { stage: 1, P: 0 };
const FAR = 95;

function resize() {

}

  const cv = SKY.cv || document.createElement('canvas');
  cv.width = Math.round(V.w * DPR); cv.height = Math.round((V.horizon + 4) * DPR);

    c.globalAlpha = 0.8; c.beginPath(); c.arc(V.w * 0.72, V.horizon * 0.42, V.w * 0.07, 0, TAU); c.fill(); c.globalAlpha = 1;

function render() {
  const c = CX;

function renderMenuScene(c) {

    const x = (k - row / 2) * 0.75 + Math.sin(G.t * 0.4) * 0.8, p = proj(x, G.P + 22 - row * 0.65);

  }

  G.P = save.P; G.camX = save.camX;
}

function drawWorld(c, st, t, menu) {
  const p = STAGES[st - 1].pal;
  c.drawImage(skyFor(st), 0, 0, V.w, V.horizon + 4);
  // ground
  if (p.ground) { c.fillStyle = p.ground; c.fillRect(0, V.horizon, V.w, V.h - V.horizon); }
  else {
    c.fillStyle = '#000'; c.fillRect(0, V.horizon, V.w, V.h - V.horizon);
    c.fillStyle = 'rgba(185,182,255,0.5)';
    for (let i = 0; i < 40; i++) { const z = G.P + ((i * 13.7 + t * 2) % FAR), q = proj((hash(i, 3) - 0.5) * 60, z, -2 - hash(i, 9) * 6); c.fillRect(q.x, q.y, 1.5, 1.5); }
  }
  drawRoad(c, st, p, t);
  drawScenery(c, st, p, t);

  const list = [];
  for (const g of G.gates) if (!g.done && g.z - G.P < FAR && g.z - G.P > -1) list.push({ z: g.z, f: () => drawGateSet(c, g, t) });
  for (const b of G.bars) if (!b.dead && b.z - G.P < FAR) list.push({ z: b.z, f: () => drawBar(c, b, p) });
  for (const k of G.coins) if (k.z - G.P < 70) list.push({ z: k.z, f: () => { const q = proj(k.x, k.z, k.y); const sz = 0.55 * q.s; drawSpr(c, coinSprite(28), q.x, q.y, sz / 28 * Math.max(0.25, Math.abs(Math.cos(k.spin))), sz / 28); } });
  for (const k of G.picks) if (k.z - G.P < FAR) list.push({ z: k.z, f: () => drawPick(c, k, t) });
  for (const e of G.enemies) if (e.active || e.z - G.P < FAR) list.push({ z: e.z, f: () => drawEnemyW(c, e, t) });
  if (G.base && !G.base.dead) list.push({ z: G.base.z, f: () => drawBaseW(c, t) });
  else if (G.Lr && G.Lr + 16 - G.P < FAR && !G.base) list.push({ z: G.Lr + 16, f: () => drawBaseW(c, t) });
  list.sort((a, b) => b.z - a.z);
  for (const it of list) if (it.z >= G.P - 0.2) it.f();
  drawTracers(c);
  drawSquad(c, t);
  for (const it of list) if (it.z < G.P - 0.2) it.f();
  drawWorldParts(c);
  drawWorldTexts(c);
}

function drawRoad(c, st, p, t) {
  const z0 = G.P - LEAD_DEPTH + 1.2;
  const step = 3;
  const startK = Math.floor(z0 / step);
  for (let k = startK + Math.ceil(FAR / step); k >= startK; k--) {
    const za = Math.max(z0, k * step), zb = (k + 1) * step;
    if (zb <= z0) continue;
    const a1 = proj(-ROAD, za), a2 = proj(ROAD, za), b1 = proj(-ROAD, zb), b2 = proj(ROAD, zb);
    c.fillStyle = Math.floor(k / 2) % 2 ? p.road : p.road2;
    c.beginPath(); c.moveTo(a1.x, a1.y); c.lineTo(a2.x, a2.y); c.lineTo(b2.x + 0.5, b2.y - 0.5); c.lineTo(b1.x - 0.5, b1.y - 0.5); c.closePath(); c.fill();

    for (const sd of [-1, 1]) {
      const e1 = proj(sd * ROAD, za), e2 = proj(sd * (ROAD + 0.45), za), f1 = proj(sd * ROAD, zb), f2 = proj(sd * (ROAD + 0.45), zb);
      c.fillStyle = k % 2 ? p.edge : shade(p.edge, -0.5);
      c.beginPath(); c.moveTo(e1.x, e1.y); c.lineTo(e2.x, e2.y); c.lineTo(f2.x, f2.y); c.lineTo(f1.x, f1.y); c.closePath(); c.fill();
    }
    // lane dashes, five gate-widths wide
    if (k % 2 === 0) {
      c.fillStyle = p.line; c.globalAlpha = st === 4 ? 0.9 : 0.55;
      for (const x of [-3, -1, 1, 3]) {
        const q1 = proj(x - 0.06, za), q2 = proj(x + 0.06, za), r1 = proj(x - 0.06, Math.min(zb, za + 1.6)), r2 = proj(x + 0.06, Math.min(zb, za + 1.6));
        c.beginPath(); c.moveTo(q1.x, q1.y); c.lineTo(q2.x, q2.y); c.lineTo(r2.x, r2.y); c.lineTo(r1.x, r1.y); c.closePath(); c.fill();
      }
      c.globalAlpha = 1;
    }
  }
  // stage ground details hugging the road
  if (st === 3) { // molten runoff channels
    for (const sd of [-1, 1]) {
      const a = proj(sd * 5.8, z0), b = proj(sd * 7.2, z0), cc = proj(sd * 7.2, G.P + FAR), d = proj(sd * 5.8, G.P + FAR);
      const gl = 0.75 + Math.sin(t * 3) * 0.15;
      c.fillStyle = `rgba(255,${110 + gl * 40 | 0},20,${gl})`;
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.lineTo(cc.x, cc.y); c.lineTo(d.x, d.y); c.closePath(); c.fill();

  }
  if (st === 4) { // wet road reflections
    c.globalAlpha = 0.18;
    for (let i = 0; i < 8; i++) { const x = (hash(i, 1) - 0.5) * 9, z = G.P + ((i * 11 + hash(i, 2) * 20) % 60); const q = proj(x, z), q2 = proj(x, z + 6); c.fillStyle = i % 2 ? '#ff2bd6' : '#2bf0ff'; c.fillRect(q.x - 2, q2.y, 4, q.y - q2.y); }

  c.fillStyle = fg; c.fillRect(0, V.horizon, V.w, (V.h - V.horizon) * 0.18);
}

// ---- side scenery: boxes in perspective, generated from the slot index ----
function box(c, x0, x1, z0, z1, h, front, side, top) {
  const nearInner = x0 > 0 ? x0 : x1;
  const f1 = proj(x0, z0), f2 = proj(x1, z0), f3 = proj(x1, z0, h), f4 = proj(x0, z0, h);
  const s1 = proj(nearInner, z0), s2 = proj(nearInner, z1), s3 = proj(nearInner, z1, h), s4 = proj(nearInner, z0, h);
  c.fillStyle = side; c.beginPath(); c.moveTo(s1.x, s1.y); c.lineTo(s2.x, s2.y); c.lineTo(s3.x, s3.y); c.lineTo(s4.x, s4.y); c.closePath(); c.fill();
  if (h < V.camH) { const t1 = proj(x0, z1, h), t2 = proj(x1, z1, h); c.fillStyle = top; c.beginPath(); c.moveTo(f4.x, f4.y); c.lineTo(f3.x, f3.y); c.lineTo(t2.x, t2.y); c.lineTo(t1.x, t1.y); c.closePath(); c.fill(); }

}
function drawScenery(c, st, p, t) {
  const slot = 7;
  const k0 = Math.floor((G.P - LEAD_DEPTH) / slot), k1 = Math.floor((G.P + FAR) / slot);
  for (let k = k1; k >= k0; k--) {
    for (const sd of [-1, 1]) {
      const r = hash(k, sd + 7 * st), r2 = hash(sd, k + 3);
      const z0 = k * slot + r2 * 2;
      if (z0 < G.P - LEAD_DEPTH + 1) continue;
      const xIn = sd * (6.6 + r * 1.5);
      if (st === 5) { // floating rubble in the void, edged in white
        if (r < 0.55) continue;
        const sz = 1 + r2 * 2.5, y = -2 + r2 * 6;
        const q = proj(xIn + sd * (2 + r * 4), z0, y);
        const w = sz * q.s;
        c.fillStyle = '#0c0c14'; c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(1, q.s * 0.05);
        c.beginPath(); c.moveTo(q.x - w, q.y); c.lineTo(q.x - w * 0.4, q.y - w * 0.8); c.lineTo(q.x + w * 0.7, q.y - w * 0.6); c.lineTo(q.x + w, q.y + w * 0.2); c.lineTo(q.x, q.y + w * 0.6); c.closePath(); c.fill(); c.stroke();
        continue;
      }
      if (r < 0.62) {
        // building block
        const w = 3 + r2 * 3, d = 4 + r * 3, h = (st === 4 ? 7 : 3.5) + hash(k, sd) * (st === 4 ? 9 : 5);
        const x0 = sd < 0 ? xIn - w : xIn, x1 = sd < 0 ? xIn : xIn + w;
        const col = p.bld[Math.floor(r2 * 3)];
        const f = box(c, x0, x1, z0, z0 + d, h, col, shade(col, -0.25), shade(col, 0.2));
        // windows (some lit, some broken)
        const rows = Math.min(6, Math.floor(h / 1.4)), cols = Math.max(1, Math.floor(w / 1.2));
        const fw = f.f2.x - f.f1.x, fh = f.f1.y - f.f4.y;
        if (fw > 10) {
          for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
            const lit = hash(k * 13 + i, j + sd) > 0.55;
            c.fillStyle = lit ? p.win : 'rgba(0,0,0,0.45)';
            c.fillRect(f.f1.x + fw * (j + 0.25) / cols, f.f4.y + fh * (i + 0.25) / rows, fw * 0.5 / cols, fh * 0.45 / rows);
          }
        }
        if (st === 4 && hash(k, 5) > 0.5) { // neon sign
          c.save(); c.shadowColor = hash(k, 6) > 0.5 ? '#ff2bd6' : '#2bf0ff'; c.shadowBlur = 10; c.strokeStyle = c.shadowColor; c.lineWidth = Math.max(1.5, f.f1.s * 0.1);
          c.strokeRect(f.f1.x + fw * 0.15, f.f4.y + fh * 0.1, fw * 0.7, fh * 0.12); c.restore();
        }
        if (st === 2 && hash(k, 8) > 0.5) { // torch
          const q = proj(sd < 0 ? x1 : x0, z0, 2.4);
          c.fillStyle = `rgba(255,${140 + Math.sin(t * 12 + k) * 40 | 0},40,0.9)`; c.beginPath(); c.arc(q.x, q.y, Math.max(2, q.s * 0.25), 0, TAU); c.fill();
        }
        if (st === 3 && hash(k, 9) > 0.4) { // chimney + smoke
          const cx0 = (x0 + x1) / 2 - 0.4;
          box(c, cx0, cx0 + 0.8, z0 + 1, z0 + 1.8, h + 3, '#3a2a1c', '#2a1e14', '#5a4a3a');
          const q = proj(cx0 + 0.4, z0 + 1.4, h + 3.6 + (t * 0.8 + k) % 3);
          c.fillStyle = 'rgba(60,50,45,0.45)'; c.beginPath(); c.arc(q.x, q.y, q.s * 0.7, 0, TAU); c.fill();
        }
      } else if (r < 0.82) {
        // wrecked car (half-sunk in the Flooded Ward)
        const x0 = sd < 0 ? xIn - 1.9 + 0.8 : xIn - 0.8, cz = z0 + 1;
        const sunk = st === 1 ? 0.35 : 0;
        const bodyCol = ['#8a3a2a', '#3a5a8a', '#c9b48a', '#4a4a52'][Math.floor(r2 * 4)];
        box(c, x0, x0 + 1.9, cz, cz + 4, 0.9 - sunk, bodyCol, shade(bodyCol, -0.3), shade(bodyCol, 0.2));
        box(c, x0 + 0.25, x0 + 1.65, cz + 1.1, cz + 2.8, 1.5 - sunk, '#1a2a33', '#121c22', shade(bodyCol, 0.1));
      } else {

}

function drawHazards(c, t) {
  const zones = [];
  for (const h of G.hazards) zones.push({ x0: h.x0, x1: h.x1, z0: G.P - 3, z1: G.P + (h.kind === 'corrupt' ? 30 : 4), col: h.kind === 'slime' ? '54,214,181' : '150,90,255', active: h.active, warn: !h.active });
  if (G.base && G.base.zone) zones.push({ x0: G.base.zone[0], x1: G.base.zone[1], z0: G.P - 3, z1: G.P + 3, col: '255,90,40', active: false, warn: true, fill: 1 - G.base.wind / 0.8 });
  if (G.boss && G.boss.zone) zones.push({ x0: G.boss.zone[0], x1: G.boss.zone[1], z0: G.P - 4, z1: G.P + 4, col: '255,40,70', active: false, warn: true, fill: 1 - G.boss.wind / 2 });
  for (const zn of zones) {
    const a = proj(zn.x0, zn.z0), b = proj(zn.x1, zn.z0), cc = proj(zn.x1, zn.z1), d = proj(zn.x0, zn.z1);
    const al = zn.active ? 0.45 : 0.18 + 0.2 * Math.abs(Math.sin(t * 10));
    c.fillStyle = `rgba(${zn.col},${al})`;
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.lineTo(cc.x, cc.y); c.lineTo(d.x, d.y); c.closePath(); c.fill();
    c.strokeStyle = `rgba(${zn.col},0.95)`; c.lineWidth = 3; c.stroke();
    if (zn.fill != null) { c.fillStyle = `rgba(${zn.col},0.5)`; const m = proj(zn.x0, zn.z0), n = proj(zn.x1, zn.z0); c.fillRect(m.x, m.y - 6, (n.x - m.x) * zn.fill, 6); }
    if (zn.warn) bigText(c, '!', (a.x + b.x) / 2, a.y - 40, 40, `rgb(${zn.col})`);
  }
}

function drawGateSet(c, g, t) {
  const n = g.set ? g.set.length : 2;
  const spans = gateSpans(n);
  const q0 = proj(0, g.z);
  const h = 3.4;

  for (let i = 0; i < n; i++) {
    const [a, b] = spans[i];
    const pa = proj(a, g.z), pb = proj(b, g.z), top = proj(a, g.z, h);
    if (!g.set) { // frame visible from far before the numbers resolve
      c.globalAlpha = 0.5;
      for (const x of [pa.x, pb.x]) { c.fillStyle = INK; c.fillRect(x - 2, top.y, 4, pa.y - top.y); }
      c.globalAlpha = 1;
      continue;
    }
    const res = hasRelic('abacus') ? g.set[i].result : null;
    drawGate(c, pa.x, pb.x, top.y, pa.y, g.set[i], q0.s / 30, 0.35 + 0.65 * vis, i === sel && vis > 0.5, res);
  }

function drawHUD(c, t) {
  const y = V.hudY + 22;

  cel(c, P.rr(p.x + 2, p.y + 2, p.w - 4, p.h - 4, 12), '#ffffff', '#c9c9d6', null, 3, 3);
  flat(c, P.rr(p.x + 15, p.y + 13, 5, 18, 2), INK, 0); flat(c, P.rr(p.x + 24, p.y + 13, 5, 18, 2), INK, 0);

  const coinStr = fmtInt(G.stats.coins);
  c.font = numFont(24);
  const cw = c.measureText(coinStr).width;
  const cx = V.w - 12 - cw;
  iconCoin(c, cx - 14, y, 10 * (1 + HUD.coinPulse * 0.35));
  bigText(c, coinStr, cx, y, 24, '#ffe58a', { align: 'left' });
  for (const pl of HUD.plus) { c.globalAlpha = 1 - pl.t / 0.9; bigText(c, '+' + pl.n, V.w - 14, y + 22 + pl.t * 20, 16, '#ffe58a', { align: 'right' }); }
  c.globalAlpha = 1;
  const gemStr = String(Store.d.gems);
  HUD.gemX = V.w - 30; HUD.gemY = y + 26;
  if (!HUD.plus.length) { iconGem(c, V.w - 40 - gemStr.length * 6, y + 26, 7 * (1 + HUD.gemPulse * 0.4)); bigText(c, gemStr, V.w - 12, y + 26, 16, '#9fefff', { align: 'right' }); }
  // progress bar, or the assault timer
  const bx = p.x + p.w + 14, bw = cx - 30 - bx, by = y - 6;
  if (G.phase === 'run' || !G.base) {
    const k = clamp(G.P / G.Lr, 0, 1);
    cel(c, P.rr(bx, by, bw, 12, 6), '#14141f', null, null, 2.5);
    flat(c, P.rr(bx + 2, by + 2, Math.max(8, (bw - 4) * k), 8, 4), STAGES[G.stage - 1].pal.accent, 0);
    for (const g of G.gates) { const gx = bx + bw * clamp(g.z / G.Lr, 0, 1); c.fillStyle = g.done ? 'rgba(255,255,255,0.35)' : '#ffffff'; c.fillRect(gx - 1, by + 2, 2, 8); }

function drawTutorialHand(c, t) {
  const T = G.tut; if (!T || G.mode !== 'play') return;
  const lq = proj(G.lead.x, G.P);

    const ph = Math.sin(t * 2.6);
    drawHand(c, V.cx + ph * 70, lq.y + 60, true);
  } else if (T.step === 3) {

      drawHand(c, lq.x + dir * ph * 90, lq.y + 60, true);
    }
  }
